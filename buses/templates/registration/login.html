{% extends "base.html" %}
{% block title %}Log in | BusBook{% endblock %}
{% block content %}
<main class="container" style="max-width:420px;margin:48px auto">
  <form method="post" class="search-card" style="display:block">
    {% csrf_token %}
    <h2 style="margin-top:0">Log in</h2>
    {{ form.as_p }}
    <button type="submit" class="btn primary wide">Log in</button>
  </form>
</main>
{% endblock %}
